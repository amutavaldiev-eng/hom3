{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header>
        <div class="logo">
            SPORT/<span>TICKET</span>
        </div>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'matches' %}">Matches</a>
            <a href="{% url 'matches' %}">Order</a>
            <a href="{% url 'my_orders' %}">My order</a>
            <a href="{% url 'profile' %}" class="header-profile">
            {% if request.user.photo %}
                <img src="{{ request.user.photo.url }}" alt="Profile">
            {% else %}
                <span>Profile</span>
            {% endif %}
        </a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
