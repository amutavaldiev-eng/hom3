{% extends 'base.html' %}

{% block content %}

<div class="profile-container">
    <div class="profile-card">
        {% if request.user.photo %}
            <img src="{{ request.user.photo.url }}" class="profile-photo">
        {% endif %}
        <h2>{{ request.user.username }}</h2>
        <div class="profile-info">
            <p>First Name: {{ request.user.first_name }}</p>
            <p>Phone: {{ request.user.phone }}</p>
        </div>
        <a href="{% url 'logout_user' %}" class="logout-btn">Logout</a>
    </div>
</div>

{% endblock %}
